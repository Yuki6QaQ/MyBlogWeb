<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <title>圆形数字练习</title>
    <style>
        .circle {
            display: inline-block;
            width: 50px;
            height: 50px;
            line-height: 50px;
            text-align: center;
            border: 2px solid gray;
            border-radius: 50%;
            color: white;
            font-size: 16px;
            border: 2px solid red;
        }

        .circle:nth-child(2n) {
            background-color: blue;
        }

        .circle:nth-child(2n+1) {
            background-color: black;
        }
    </style>
</head>

<body>
    <h3>使用 div 显示</h3>
    <div class="circle">1</div>
    <div class="circle">2</div>
    <div class="circle">3</div>
    <div class="circle">4</div>
    <div class="circle">5</div>
    <div class="circle">6</div>
    <div class="circle">7</div>
    <div class="circle">8</div>
    <div class="circle">9</div>
    <div class="circle">10</div>
    <div class="circle">11</div>
    <div class="circle">12</div>
    <div class="circle">13</div>
    <div class="circle">14</div>
    <div class="circle">15</div>
    <div class="circle">16</div>
    <div class="circle">17</div>
    <div class="circle">18</div>
    <div class="circle">19</div>
    <div class="circle">20</div>

    <h3>使用 span 显示</h3>
    <span class="circle">1</span>
    <span class="circle">2</span>
    <span class="circle">3</span>
    <span class="circle">4</span>
    <span class="circle">5</span>
    <span class="circle">6</span>
    <span class="circle">7</span>
    <span class="circle">8</span>
    <span class="circle">9</span>
    <span class="circle">10</span>
    <span class="circle">11</span>
    <span class="circle">12</span>
    <span class="circle">13</span>
    <span class="circle">14</span>
    <span class="circle">15</span>
    <span class="circle">16</span>
    <span class="circle">17</span>
    <span class="circle">18</span>
    <span class="circle">19</span>
    <span class="circle">20</span>

    <h3>使用 p 显示</h3>
    <p class="circle">1</p>
    <p class="circle">2</p>
    <p class="circle">3</p>
    <p class="circle">4</p>
    <p class="circle">5</p>
    <p class="circle">6</p>
    <p class="circle">7</p>
    <p class="circle">8</p>
    <p class="circle">9</p>
    <p class="circle">10</p>
    <p class="circle">11</p>
    <p class="circle">12</p>
    <p class="circle">13</p>
    <p class="circle">14</p>
    <p class="circle">15</p>
    <p class="circle">16</p>
    <p class="circle">17</p>
    <p class="circle">18</p>
    <p class="circle">19</p>
    <p class="circle">20</p>
</body>

</html>
