<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频卡片悬停效果</title>
    <style>
        a {
            text-decoration: none;
            display: block;
        }

        .con {
            position: relative;
            width: 400px;
            height: 250px;
            overflow: hidden;
            border-radius: 8px;
        }

        .con .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .play-btn {
            opacity: 0;
            position: absolute;
            width: 56px;
            height: 56px;
            right: 10%;
            bottom: 10%;
            background: url(./img/blzt.png) no-repeat center center;
            background-size: contain;
            z-index: 2;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .con:hover .play-btn {
            opacity: 1;
        }

        .mask {
            width: 100%;
            height: 0;
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            transition: height 0.5s ease-in-out;
            overflow: hidden;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .mask h1 {
            margin: 0;
            font-size: 18px;
        }

        .mask p {
            margin: 5px 0 0 0;
            font-size: 12px;
        }

        .con:hover .mask {
            height: 100%;
        }
    </style>
</head>

<body>
    <div class="con">
        <a href="https://www.bilibili.com/video/BV1u64y1a7hW/" target="_blank" class="item">
            <img src="./img/bl.jpg" alt="视频封面">
        </a>
        <div class="play-btn"></div>
        <a href="https://www.bilibili.com/video/BV1u64y1a7hW/" target="_blank" class="mask">
            <h1>她在哪里了</h1>
            <p>远方的他，正无语凝眸，望眼欲穿。。。</p>
        </a>
    </div>

</body>

</html>
