<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美的官网导航栏仿制</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .header {
            background-color: #f0f0f0;
            height: 70px;
            position: relative;
            z-index: 100;
        }

        .container {
            width: 1200px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #0066cc;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .logo span {
            color: #0066cc;
            font-size: 28px;
            margin-right: 5px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            height: 100%;
        }

        .nav-item {
            height: 100%;
            display: flex;
            align-items: center;
            margin: 0 10px;
            position: relative;
        }

        .nav-link {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            font-weight: 500;
            padding: 0 5px;
            height: 100%;
            display: flex;
            align-items: center;
            transition: color 0.3s;
        }

        .nav-item:hover .nav-link {
            color: #0066cc;
        }

        .dropdown {
            position: absolute;
            top: 100%;

            left: 0;
            width: 200px;

            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: none;
            padding: 10px 0;
            overflow-y: auto;

            max-height: 300px;

            z-index: 1000;

        }


        .nav-item:hover .dropdown {
            display: block;
        }


        .dropdown a {
            display: block;
            padding: 10px 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            border-bottom: 1px solid #eee;
        }


        .dropdown a:hover {
            background-color: #f9f9f9;
            color: #0066cc;
        }

        .right-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .action-btn {
            text-decoration: none;
            color: #666;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn:hover {
            color: #0066cc;
        }


        .search-icon {
            font-size: 18px;
            color: #666;
            cursor: pointer;
        }

        .language-icon {
            font-size: 18px;
            color: #666;
            cursor: pointer;
        }

        .language-text {
            color: #666;
            font-size: 14px;
            cursor: pointer;
        }


        .language-text:hover {
            color: #0066cc;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="container">
            <div class="logo">
                <span>M</span> Midea
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link">美的业务</a>
                    <div class="dropdown">
                        <a href="#">总览</a>
                        <a href="#">智能家居</a>
                        <a href="#">工业技术</a>
                        <a href="#">楼宇科技</a>
                        <a href="#">机器人与自动化</a>
                        <a href="#">美的能源</a>
                        <a href="#">美的医疗</a>
                        <a href="#">安得智联</a>
                        <a href="#">专业平台</a>
                    </div>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">投资者关系</a>
                    <div class="dropdown">
                        <a href="#">总览</a>
                        <a href="#">致股东的信</a>
                        <a href="#">公司治理</a>
                        <a href="#">股票信息</a>
                        <a href="#">财务报告</a>
                        <a href="#">信息披露</a>
                        <a href="#">可持续发展</a>
                    </div>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">美的商城</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">美的美居</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">美的服务</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">加入美的</a>
                    <div class="dropdown">
                        <a href="#">总览</a>
                        <a href="#">工作在美的</a>
                        <a href="#">美的文化</a>

                        <a href="#">社会招聘</a>

                    </div>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">关于美的</a>
                    <div class="dropdown">
                        <a href="#">总览</a>

                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">美的供应商</a>
                </li>
            </ul>

            <div class="right-actions">
                <div class="search-icon">🔍</div>
                <div class="language-icon">🌐</div>
                <div class="language-text">中文 / EN</div>
            </div>
        </div>
    </header>

    <div style="padding: 50px; text-align: center; color: #999;">
        <h1>欢迎来到美的官网</h1>

</body>

</html>
