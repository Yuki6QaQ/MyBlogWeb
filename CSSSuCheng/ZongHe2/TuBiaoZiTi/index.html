<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图标字体实战 - Yuki的博客</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/sidebar.css">
    <link rel="stylesheet" href="../../../css/content.css">
    <link rel="stylesheet" href="../../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .project-header {
            margin-bottom: 1.5rem;
            padding: 1.5rem;
        }

        .project-meta {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .meta-tag {
            background: rgba(116, 185, 255, 0.1);
            color: var(--primary-color);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .back-btn:hover {
            color: var(--primary-color);
            transform: translateX(-5px);
        }

        .simple-sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        #homework-wrapper {
            width: 100%;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            color: #334155;
            line-height: 1.6;
        }

        #homework-wrapper .hw-main-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding-bottom: 40px;
        }

        #homework-wrapper .hw-section-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(30, 64, 175, 0.08);
            padding: 40px;
            animation: hwFadeInUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            width: 100%;
        }

        @keyframes hwFadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #homework-wrapper .cart-container {
            position: relative;
            display: inline-block;
            height: 40px;
            line-height: 40px;
            padding: 0 10px;
            text-align: center;
            cursor: pointer;
            color: #333;
            transition: color 0.2s;
            font-family: "Microsoft YaHei", sans-serif;
        }

        #homework-wrapper .cart-container:hover {
            color: #e1251b;
        }

        #homework-wrapper .cart-icon-svg {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 5px;
            fill: currentColor;
        }

        #homework-wrapper .cart-count {
            position: absolute;
            top: -5px;
            right: -12px;
            height: 16px;
            line-height: 16px;
            padding: 0 4px;
            background-color: #e1251b;
            color: #fff;
            font-size: 12px;
            font-style: normal;
            border-radius: 8px;
            min-width: 16px;
            text-align: center;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="background"></div>

    <nav class="navbar glass">
        <div class="nav-container">
            <a href="../../../index.html" class="nav-logo">Yuki</a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="../../../index.html#home" class="nav-link">主页</a></li>
                <li class="nav-item"><a href="../../../index.html#portfolio" class="nav-link">个人作品</a></li>
                <li class="nav-item"><a href="../../../index.html#notes" class="nav-link">小组作业</a></li>
                <li class="nav-item"><a href="../../../index.html#about" class="nav-link">关于</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <aside class="left-sidebar simple-sidebar">
            <div class="avatar-container glass">
                <img src="../../../img/TouXiang.jpg" alt="Yuki头像" class="avatar">
            </div>
            <div class="status-card glass">
                <div class="status-quote">正在查看项目演示</div>
            </div>
        </aside>

        <div class="right-content">
            <a href="../../../index.html#portfolio" class="back-btn">
                <i class="fas fa-arrow-left"></i> 返回作品列表
            </a>

            <div class="greeting-section glass project-header fade-in visible">
                <h1 class="greeting-title">图标字体与 SVG <span class="highlight">🛒</span></h1>
                <p class="greeting-subtitle">矢量图标应用、SVG 嵌入与购物车交互实战</p>
                <div class="project-meta">
                    <span class="meta-tag"><i class="fab fa-css3-alt"></i> CSS3</span>
                    <span class="meta-tag"><i class="fas fa-layer-group"></i> 课程作业</span>
                </div>
            </div>

            <section class="section">
                <div id="homework-wrapper">
                    <div class="hw-main-container">
                        <div class="hw-section-card">
                            <div class="cart-container">
                                <svg class="cart-icon-svg" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M904.3 352.7c-14.6-14.6-38.4-14.6-53 0L746.7 457.3c-14.6 14.6-14.6 38.4 0 53 7.3 7.3 16.9 11 26.5 11s19.2-3.7 26.5-11l104.6-104.6c14.6-14.6 14.6-38.4 0-53zM853.3 565.3c-14.6-14.6-38.4-14.6-53 0L695.7 669.9c-14.6 14.6-14.6 38.4 0 53 7.3 7.3 16.9 11 26.5 11s19.2-3.7 26.5-11l104.6-104.6c14.6-14.6 14.6-38.4 0-53zM802.3 777.9c-14.6-14.6-38.4-14.6-53 0L644.7 882.5c-14.6 14.6-14.6 38.4 0 53 7.3 7.3 16.9 11 26.5 11s19.2-3.7 26.5-11l104.6-104.6c14.6-14.6 14.6-38.4 0-53zM192 896h640c17.7 0 32-14.3 32-32V256c0-17.7-14.3-32-32-32H192c-17.7 0-32 14.3-32 32v608c0 17.7 14.3 32 32 32zm32-608h576v544H224V288z" />
                                    <path
                                        d="M384 448h256c17.7 0 32-14.3 32-32s-14.3-32-32-32H384c-17.7 0-32 14.3-32 32s14.3 32 32 32zm0 192h256c17.7 0 32-14.3 32-32s-14.3-32-32-32H384c-17.7 0-32 14.3-32 32s14.3 32 32 32zm0 192h256c17.7 0 32-14.3 32-32s-14.3-32-32-32H384c-17.7 0-32 14.3-32 32s14.3 32 32 32z" />
                                </svg>
                                <span>我的购物车</span>
                                <i class="cart-count">1</i>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
