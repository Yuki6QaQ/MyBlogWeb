<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 图片正方体</title>
    <style>
        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .con {
            position: relative;
            width: 200px;
            height: 200px;
            perspective: 1000px;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .side {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            line-height: 200px;
            text-align: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
            opacity: 0.95;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5) inset;
            background-size: cover;
            background-position: center;
        }

        .front {
            background-image: url('./img/Handsome\ \(1\).jpg');
            transform: translateZ(100px);
        }

        .back {
            background-image: url('./img/Handsome\ \(3\).jpg');
            transform: rotateY(180deg) translateZ(100px);
        }

        .left {
            background-image: url('./img/Handsome\ \(4\).jpg');
            transform: rotateY(-90deg) translateZ(100px);
        }

        .right {
            background-image: url('./img/Meinv1.jpg');
            transform: rotateY(90deg) translateZ(100px);
        }

        .top {
            background-image: url('./img/Meinv2.jpg');
            transform: rotateX(90deg) translateZ(100px);
        }

        .bottom {
            background-image: url('./img/Meinv3.jpg');
            transform: rotateX(-90deg) translateZ(100px);
        }
    </style>
</head>

<body>

    <div class="con">
        <div class="cube" id="cube">
            <div class="side front"></div>
            <div class="side back"></div>
            <div class="side left"></div>
            <div class="side right"></div>
            <div class="side top"></div>
            <div class="side bottom"></div>
        </div>
    </div>

    <script>
        const cube = document.getElementById('cube');

        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;

            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            const rotateY = ((x / windowWidth) - 0.5) * 360;
            const rotateX = -((y / windowHeight) - 0.5) * 360;

            cube.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
    </script>

</body>

</html>
