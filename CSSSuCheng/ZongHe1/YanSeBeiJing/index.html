<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色和背景 - Yuki的博客</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/sidebar.css">
    <link rel="stylesheet" href="../../../css/content.css">
    <link rel="stylesheet" href="../../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">

    <style>
        .simple-sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .back-btn:hover {
            color: var(--primary-color);
            transform: translateX(-5px);
        }

        .right-content .section {
            gap: 2rem;
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <nav class="navbar glass">
        <div class="nav-container">
            <a href="../../../index.html" class="nav-logo">Yuki</a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="../../../index.html#home" class="nav-link">主页</a></li>
                <li class="nav-item"><a href="../../../index.html#portfolio" class="nav-link">个人作品</a></li>
                <li class="nav-item"><a href="../../../index.html#notes" class="nav-link">小组作业</a></li>
                <li class="nav-item"><a href="../../../index.html#about" class="nav-link">关于</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <aside class="left-sidebar simple-sidebar">
            <div class="avatar-container glass">
                <img src="../../../img/TouXiang.jpg" alt="Yuki头像" class="avatar">
            </div>
            <div class="status-card glass">
                <div class="status-quote">正在查看项目演示</div>
            </div>
        </aside>

        <div class="right-content">
            <a href="../../../index.html#portfolio" class="back-btn">
                <i class="fas fa-arrow-left"></i> 返回作品列表
            </a>

            <div class="greeting-section glass project-header fade-in visible">
                <h1 class="greeting-title">颜色和背景 <span class="highlight">👻</span></h1>
                <p class="greeting-subtitle">CSS 布局 / 精灵图 / 渐变效果展示</p>
                <div class="project-meta">
                    <span class="meta-tag"><i class="fas fa-code"></i> HTML5</span>
                    <span class="meta-tag"><i class="fas fa-layer-group"></i> 课程作业</span>
                </div>
            </div>

            <section class="section">

                <div id="section-star" class="section-card">
                    <h2 style="text-align: center; margin-bottom: 20px; color: #1e40af;">五星布局展示</h2>
                    <div class="star-container">
                        <div class="star-text">我是一个兵，爱护老百姓。</div>
                    </div>
                </div>

                <div id="section-jlt" class="section-card">
                    <h2 style="text-align: center; margin-bottom: 20px; color: #1e40af;">CSS 精灵图展示</h2>

                    <div class="jlt-wrapper">
                        <div id="jlt-l" class="jlt-item"></div>
                        <div id="jlt-x" class="jlt-item"></div>
                        <div id="jlt-y" class="jlt-item"></div>
                    </div>
                </div>

                <div id="section-gradient" class="section-card">
                    <h2 style="text-align: center; margin-bottom: 20px; color: #1e40af;">CSS 渐变效果展示</h2>
                    <div class="gradient-demo-container">
                        <div class="d1"></div>
                        <div class="d2"></div>
                        <div class="d3"></div>
                        <div class="d4"></div>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <footer class="footer glass">
        <p>© 2026 Yuki的博客. Made with ❤️</p>
    </footer>

    <script src="../../../js/ui.js"></script>
    <script src="script.js"></script>
</body>

</html>
