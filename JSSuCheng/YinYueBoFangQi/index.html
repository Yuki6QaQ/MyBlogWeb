<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 音乐播放器 - Yuki的博客</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/sidebar.css">
    <link rel="stylesheet" href="../../css/content.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .project-header {
            margin-bottom: 1.5rem;
            padding: 1.5rem;
        }

        .project-meta {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .meta-tag {
            background: rgba(116, 185, 255, 0.1);
            color: var(--primary-color);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .result-container {
            width: 100%;
            min-height: 600px;
            background: transparent;
            border-radius: 12px;
            overflow: hidden;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .back-btn:hover {
            color: var(--primary-color);
            transform: translateX(-5px);
        }

        .simple-sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        /* 移植并修改原 style.css 中的 body 样式，应用到播放器容器 */
        .music-player-wrapper {
            width: 100%;
            max-width: 1200px;
            height: 80vh;
            min-height: 600px;
            display: flex;
            gap: 40px;
            padding: 40px;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #141e30);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* 以下样式从原 style.css 迁移，确保选择器正确 */
        .weather-widget {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            transition: all 0.3s ease;
        }

        .weather-display {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .weather-icon i {
            font-size: 1.2rem;
            color: #ffd700;
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        #w-temp {
            font-size: 1rem;
            font-weight: bold;
        }

        #w-desc {
            font-size: 0.75rem;
            opacity: 0.8;
            text-transform: capitalize;
        }

        .weather-search {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: 10px;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            padding-left: 10px;
        }

        #city-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 5px;
            width: 100px;
            outline: none;
            font-size: 0.9rem;
            transition: width 0.3s;
        }

        #city-input:focus {
            width: 140px;
            border-bottom-color: #ec4141;
        }

        #city-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        #search-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0 5px;
            transition: color 0.3s;
        }

        #search-btn:hover {
            color: #ec4141;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .right-panel {
            flex: 2;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .record-player {
            width: 300px;
            height: 300px;
            position: relative;
            margin-bottom: 20px;
        }

        .turntable {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #1a1a1a;
            border: 1px solid #333;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .record {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s ease;
        }

        .record.rotate {
            animation: rotateRecord 20s linear infinite;
        }

        @keyframes rotateRecord {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .record img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .tone-arm {
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            transform-origin: top right;
            transform: rotate(-45deg);
            z-index: 10;
            transition: transform 0.5s ease;
        }

        .playing .tone-arm {
            transform: rotate(0deg);
        }

        .counterweight {
            width: 10px;
            height: 20px;
            background-color: #ccc;
            border-radius: 5px;
            position: absolute;
            top: 0;
            left: 0;
            transform: translateX(-5px);
        }

        .arm {
            width: 10px;
            height: 80px;
            background-color: #ccc;
            border-radius: 5px;
            position: absolute;
            top: 0;
            left: 0;
            transform: translateY(10px);
        }

        .cartridge {
            width: 20px;
            height: 10px;
            background-color: #ccc;
            border-radius: 5px;
            position: absolute;
            bottom: 0;
            left: 0;
            transform: translateX(5px);
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .control-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #ccc;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .control-btn:hover {
            color: #ec4141;
            transform: scale(1.1);
        }

        .play-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            color: #ec4141;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .play-btn:hover {
            background-color: #ec4141;
            color: white;
            box-shadow: 0 0 15px rgba(236, 65, 65, 0.4);
        }

        .song-info {
            margin-bottom: 20px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .song-info h2 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .song-info p {
            font-size: 1.1rem;
            color: #ccc;
            font-weight: 500;
        }

        .song-meta {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #999;
        }

        .lyrics-container {
            height: 300px;
            margin-bottom: 20px;
            overflow-y: auto;
            padding: 10px;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            transition: opacity 0.5s ease;
        }

        .lyrics-container::-webkit-scrollbar {
            width: 4px;
        }

        .lyrics-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .lyrics-container::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .lyrics-container::-webkit-scrollbar-thumb:hover {
            background-color: rgba(236, 65, 65, 0.5);
        }

        .lyrics-wrapper {
            text-align: left;
            line-height: 2;
            padding: 10px 0;
        }

        .lyric-line {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 5px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .lyric-line.active {
            color: #ec4141;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 10px rgba(236, 65, 65, 0.3);
            transform: translateX(5px);
        }

        .lyric-placeholder {
            color: #666;
            font-size: 0.9rem;
            margin-top: 40px;
            text-align: center;
        }

        .progress-area {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 10px 0;
            font-size: 0.9rem;
            color: #ccc;
            font-variant-numeric: tabular-nums;
        }

        .volume-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            height: 30px;
        }

        #volume-icon {
            color: #ccc;
            font-size: 1rem;
            cursor: pointer;
            transition: color 0.3s;
            width: 20px;
            text-align: center;
            z-index: 2;
        }

        #volume-icon:hover {
            color: #ec4141;
        }

        .vertical-volume-container {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 100px;
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 15px;
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .volume-wrapper:hover .vertical-volume-container {
            opacity: 1;
            visibility: visible;
            bottom: 40px;
        }

        .vertical-volume-bg {
            width: 4px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .vertical-volume-bar {
            width: 100%;
            background-color: #ec4141;
            height: 70%;
            position: absolute;
            bottom: 0;
            left: 0;
            border-radius: 2px;
            transition: height 0.1s linear;
        }

        .progress-bar-container {
            flex: 1;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
        }

        .progress-bar-container:hover {
            height: 8px;
        }

        .progress-bar {
            height: 100%;
            background-color: #ec4141;
            width: 0%;
            border-radius: 3px;
            position: relative;
            box-shadow: 0 0 10px rgba(236, 65, 65, 0.5);
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            transition: transform 0.2s ease;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .progress-bar-container:hover .progress-dot {
            transform: translateY(-50%) scale(1);
        }

        .fade-out {
            opacity: 0;
            transform: translateY(10px);
        }

        .fade-in {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="background"></div>

    <nav class="navbar glass">
        <div class="nav-container">
            <a href="../../index.html" class="nav-logo">Yuki</a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="../../index.html#home" class="nav-link">主页</a></li>
                <li class="nav-item"><a href="../../index.html#portfolio" class="nav-link">个人作品</a></li>
                <li class="nav-item"><a href="../../index.html#notes" class="nav-link">小组作业</a></li>
                <li class="nav-item"><a href="../../index.html#about" class="nav-link">关于</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <aside class="left-sidebar simple-sidebar">
            <div class="avatar-container glass">
                <img src="../../img/TouXiang.jpg" alt="Yuki头像" class="avatar">
            </div>

            <div class="status-card glass">
                <div class="status-quote">正在查看项目演示</div>
            </div>
        </aside>

        <div class="right-content">

            <a href="../../index.html#portfolio" class="back-btn">
                <i class="fas fa-arrow-left"></i> 返回作品列表
            </a>

            <div class="greeting-section glass project-header fade-in visible">
                <h1 class="greeting-title">JS 音乐播放器 <span class="highlight">🎵</span></h1>
                <p class="greeting-subtitle">仿网易云音乐界面与 API 交互实战</p>
                <div class="project-meta">
                    <span class="meta-tag"><i class="fab fa-js"></i> JavaScript</span>
                    <span class="meta-tag"><i class="fas fa-music"></i> 多媒体</span>
                </div>
            </div>

            <section class="section">
                <div class="intro glass fade-in visible" style="padding: 0; overflow: hidden;">
                    <div class="result-container">
                        <div class="music-player-wrapper">
                            <div class="weather-widget" id="weather-widget">
                                <div class="weather-display">
                                    <div class="weather-icon">
                                        <i class="fas fa-cloud-sun" id="w-icon"></i>
                                    </div>
                                    <div class="weather-info">
                                        <span id="w-temp">--°C</span>
                                        <span id="w-desc">Loading...</span>
                                    </div>
                                </div>

                                <div class="weather-search">
                                    <input type="text" id="city-input" placeholder="输入城市...">
                                    <button id="search-btn"><i class="fas fa-search"></i></button>
                                </div>
                            </div>

                            <div class="left-panel">
                                <div class="record-player">
                                    <div class="turntable">
                                        <div class="record">
                                            <img src="" alt="Cover" id="cover-img">
                                        </div>
                                        <div class="tone-arm">
                                            <div class="counterweight"></div>
                                            <div class="arm"></div>
                                            <div class="cartridge"></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="controls">
                                    <button id="prev-btn" class="control-btn"><i
                                            class="fas fa-step-backward"></i></button>
                                    <button id="play-btn" class="control-btn play-btn"><i
                                            class="fas fa-play"></i></button>
                                    <button id="next-btn" class="control-btn"><i
                                            class="fas fa-step-forward"></i></button>
                                </div>
                            </div>

                            <div class="right-panel">
                                <div class="song-info">
                                    <h2 id="song-title">歌曲标题</h2>
                                    <p id="artist-name">歌手名字</p>
                                    <div class="song-meta">
                                        <span>专辑: <span id="album-name">未知专辑</span></span>
                                        <span>来源: <span id="source-name">搜索</span></span>
                                    </div>
                                </div>

                                <div class="lyrics-container">
                                    <div class="lyrics-wrapper" id="lyrics-wrapper">
                                        <p class="lyric-placeholder">暂无歌词</p>
                                    </div>
                                </div>

                                <div class="progress-area">
                                    <div class="volume-wrapper">
                                        <i class="fas fa-volume-up" id="volume-icon"></i>
                                        <div class="vertical-volume-container" id="vertical-volume-container">
                                            <div class="vertical-volume-bar" id="vertical-volume-bar"></div>
                                        </div>
                                    </div>

                                    <span id="current-time">00:00</span>
                                    <div class="progress-bar-container" id="progress-container">
                                        <div class="progress-bar" id="progress-bar"></div>
                                        <div class="progress-dot" id="progress-dot"></div>
                                    </div>
                                    <span id="duration">00:00</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <audio id="audio" src=""></audio>

                    <script src="script.js"></script>
                </div>
            </section>

        </div>
    </main>

    <footer class="footer glass">
        <p>© 2026 Yuki的博客. Made with ❤️</p>
    </footer>

    <script src="../../js/ui.js"></script>
</body>
