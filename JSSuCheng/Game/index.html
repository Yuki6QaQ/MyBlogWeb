<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏盒子主页</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="welcome-modal" class="modal">
        <div class="modal-content">
            <h2>欢迎来到我们的游戏中心</h2>
            <p>这里是所有精彩游戏的聚集地。</p>
            <p>你可以搜索喜欢的游戏开始挑战。</p>
            <p>祝你在游戏中获得乐趣！</p>
            <button id="close-modal-btn">开始探索</button>
        </div>
    </div>

    <h1>游戏中心</h1>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="搜索游戏...">
    </div>

    <div class="game-container" id="game-container">
    </div>

    <script src="./script.js"></script>
    <footer class="footer">
        <a href="https://gitee.com/yuki678/group-assignment.git" target="_blank" class="repo-link">🏠查看项目仓库</a>
        <a href="https://www.bilibili.com/video/BV1efGJ6mEiB/?share_source=copy_web&vd_source=c1336609e60bb02c65bd5938996c5d42"
            target="_blank" class="repo-link">📽️讲解视频</a>
    </footer>
</body>

</html>
